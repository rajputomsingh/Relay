version: 2.1

executors:
  go-executor:
    docker:
      - image: cimg/go:1.27.0
    resource_class: medium
    working_directory: ~/project

commands:
  restore-go-cache:
    steps:
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-

  wait-for-mongo:
    steps:
      - run:
          name: Wait for MongoDB
          shell: /bin/bash
          command: |
            for i in $(seq 1 60); do
              if (echo > /dev/tcp/localhost/27017) >/dev/null 2>&1; then
                echo "MongoDB is accepting connections."
                exit 0
              fi
              sleep 1
            done
            echo "MongoDB did not become available within 60 seconds."
            exit 1

jobs:
  install:
    executor: go-executor
    steps:
      - checkout
      - restore-go-cache
      - run:
          name: Download Go modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    executor: go-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run go vet
          command: go vet ./...
      - run:
          name: Check gofmt
          command: |
            UNFORMATTED=$(gofmt -l ./cmd ./internal ./bench ./sdk-go)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following files are not formatted:"
              echo "$UNFORMATTED"
              exit 1
            fi

  test:
    executor: go-executor
    docker:
      - image: cimg/go:1.27.0
      - image: mongo:7.0
    environment:
      MONGODB_TEST_URI: mongodb://localhost:27017
      RELAY_API_KEY: "test-key-1234567890-abcdefghijklmnop"
      APP_ENV: development
    steps:
      - attach_workspace:
          at: .
      - wait-for-mongo
      - run:
          name: Run Integration and Unit Tests
          command: go test -v ./...

  worker-outage-test:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    environment:
      MONGODB_TEST_URI: mongodb://localhost:27017
      MONGODB_TEST_CONTAINER: relay-mongo
      RELAY_API_KEY: "test-key-1234567890-abcdefghijklmnop"
      APP_ENV: development
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Go
          command: |
            curl -fsSL https://go.dev/dl/go1.27.0.linux-amd64.tar.gz \
              -o /tmp/go.tar.gz
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            echo 'export PATH=/usr/local/go/bin:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            go version

      - run:
          name: Start MongoDB
          command: |
            docker run -d \
              --name relay-mongo \
              -p 27017:27017 \
              mongo:7.0

      - run:
          name: Wait for MongoDB
          command: |
            for i in $(seq 1 60); do
              if docker exec relay-mongo \
                mongosh --quiet \
                --eval 'db.adminCommand("ping").ok' 2>/dev/null \
                | grep -q 1; then
                echo "MongoDB is ready."
                exit 0
              fi
              sleep 1
            done
            echo "MongoDB failed to become ready."
            docker logs relay-mongo
            exit 1

      - run:
          name: Run Worker MongoDB Outage Recovery Test
          command: |
            go test ./internal/delivery \
              -run '^TestWorkerRecoversFromMongoOutage$' \
              -count=1 -v

      - run:
          name: Cleanup MongoDB
          when: always
          command: docker rm -f relay-mongo || true

  sdk-integration:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    environment:
      RELAY_API_KEY: "test-key-1234567890-abcdefghijklmnop"
      RELAY_TEST_BASE_URL: "http://localhost:8080"
      RELAY_TEST_API_KEY: "test-key-1234567890-abcdefghijklmnop"
      # Prevent apt's needrestart from prompting interactively during
      # package installation, which causes the job to hang and hit the
      # 10-minute no_output_timeout.
      NEEDRESTART_MODE: a
      DEBIAN_FRONTEND: noninteractive
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Install Go
          command: |
            curl -fsSL https://go.dev/dl/go1.27.0.linux-amd64.tar.gz \
              -o /tmp/go.tar.gz
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            echo 'export PATH=/usr/local/go/bin:$PATH' >> "$BASH_ENV"
            source "$BASH_ENV"
            go version

      - run:
          name: Install Node
          command: |
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo -E apt-get install -y \
              -o Dpkg::Options::=--force-confdef \
              -o Dpkg::Options::=--force-confold \
              nodejs
            node --version
            npm --version

      - run:
          name: Install pnpm
          command: |
            sudo npm install -g pnpm
            pnpm --version

      - run:
          name: Install Python
          command: |
            sudo -E apt-get install -y \
              -o Dpkg::Options::=--force-confdef \
              -o Dpkg::Options::=--force-confold \
              python3 python3-pip python3-venv
            python3 --version

      - run:
          name: Start Relay and MongoDB via Docker Compose
          command: |
            cd ~/project
            docker compose up -d --build mongo relay
            # Wait for Relay HTTP server (up to 120s)
            for i in $(seq 1 120); do
              if curl -fsS http://localhost:8080/healthz > /dev/null 2>&1; then
                echo "Relay HTTP is up."
                break
              fi
              sleep 1
            done
            # Wait for Relay readiness (Mongo + indexes, up to 60s)
            for i in $(seq 1 60); do
              READY=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/readyz)
              if [ "$READY" = "200" ]; then
                echo "Relay is ready."
                break
              fi
              if [ $i -eq 60 ]; then
                echo "Relay did not become ready within 60s."
                docker compose logs relay
                exit 1
              fi
              sleep 1
            done

      - run:
          name: Go SDK tests against live Relay
          command: |
            cd ~/project
            MONGODB_TEST_URI=mongodb://localhost:27017 \
              go test ./sdk-go/... -count=1 -v

      - run:
          name: Node SDK tests against live Relay
          command: |
            cd ~/project/sdk-node
            npm install -g pnpm@10.34.9
            pnpm --version
            pnpm install --frozen-lockfile
            pnpm test
                        
      - run:
          name: Python SDK tests against live Relay
          command: |
            cd ~/project/sdk-python
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -e ".[dev]"
            python -m pytest tests/ -v

      - run:
          name: Cleanup Docker Compose
          when: always
          command: |
            cd ~/project
            docker compose down -v --remove-orphans || true

  build:
    executor: go-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Build binary
          command: go build -v ./...

  docker-build:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build Docker Image
          command: |
            docker build -t relay:test .
            echo "Docker build successful. Image size:"
            docker images relay:test --format "{{.Size}}"

workflows:
  relay-validation:
    jobs:
      - install

      - lint:
          requires:
            - install

      - test:
          requires:
            - install

      - worker-outage-test:
          requires:
            - install

      - sdk-integration:
          requires:
            - install
            - test
            - worker-outage-test

      - build:
          requires:
            - install

      - docker-build:
          requires:
            - install
          filters:
            branches:
              only: main
