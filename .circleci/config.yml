version: 2.1

executors:
  go-executor:
    docker:
      - image: cimg/go:1.27.0
    resource_class: medium
    working_directory: ~/project

commands:
  restore-go-cache:
    steps:
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-

  wait-for-mongo:
    steps:
      - run:
          name: Wait for MongoDB
          shell: /bin/bash
          command: |
            for i in $(seq 1 60); do
              if (echo > /dev/tcp/localhost/27017) >/dev/null 2>&1; then
                echo "MongoDB is accepting connections."
                exit 0
              fi
              sleep 1
            done
            echo "MongoDB did not become available within 60 seconds."
            exit 1

jobs:
  install:
    executor: go-executor
    steps:
      - checkout
      - restore-go-cache
      - run:
          name: Download Go modules
          command: go mod download
      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    executor: go-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run go vet
          command: go vet ./...
      - run:
          name: Check gofmt
          command: |
            UNFORMATTED=$(gofmt -l ./cmd ./internal ./bench)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following files are not formatted:"
              echo "$UNFORMATTED"
              exit 1
            fi

  test:
    executor: go-executor
    docker:
      - image: cimg/go:1.27.0
      - image: mongo:7.0
    environment:
      MONGODB_TEST_URI: mongodb://localhost:27017
      RELAY_API_KEY: "test-key-1234567890-abcdefghijklmnop"
      APP_ENV: development
    steps:
      - attach_workspace:
          at: .
      - wait-for-mongo
      - run:
          name: Run Tests
          command: go test -v ./...

  build:
    executor: go-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Build binary
          command: go build -v ./...

  docker-build:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build Docker Image
          command: |
            docker build -t relay:test .
            echo "Docker build successful. Image size:"
            docker images relay:test --format "{{.Size}}"

workflows:
  relay-validation:
    jobs:
      - install
      - lint:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - install
      - docker-build:
          requires:
            - install
          filters:
            branches:
              only: main
