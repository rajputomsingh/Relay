version: 2.1

jobs:
  relay-ci:
    docker:
      - image: cimg/go:1.27.0
      - image: mongo:7.0
    environment:
      MONGODB_TEST_URI: mongodb://mongo:27017
    steps:
      - checkout

      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-

      - run:
          name: Download Go modules
          command: go mod download

      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

      - run:
          name: Wait for MongoDB
          shell: /bin/bash
          command: |
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/mongo/27017) >/dev/null 2>&1; then
                echo "MongoDB ready."
                exit 0
              fi
              echo "Waiting for MongoDB ($i/30)"
              sleep 1
            done
            exit 1

      - run:
          name: Run tests
          command: go test -v ./...

      - run:
          name: Run go vet
          command: go vet ./...

      - run:
          name: Build packages
          command: go build ./...

workflows:
  relay-validation:
    jobs:
      - relay-ci
