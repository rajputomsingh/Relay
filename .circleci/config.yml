version: 2.1

jobs:
  relay-ci:
    docker:
      - image: cimg/go:1.27.0
      - image: mongo:7.0
    environment:
      MONGODB_TEST_URI: mongodb://mongo:27017
    steps:
      - checkout

      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
            - go-mod-v1-

      - run:
          name: Download Go modules
          command: go mod download

      - save_cache:
          key: go-mod-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

      - run:
          name: Check Go formatting
          command: |
            echo "Running gofmt check..."
            echo "Working directory: $(pwd)"
            echo "Go files found:"
            find . -type f -name '*.go' -not -path './vendor/*'
            echo "---"
            echo "Running gofmt -l..."
            UNFORMATTED=$(find . -type f -name '*.go' -not -path './vendor/*' -exec gofmt -l {} +)
            FMT_STATUS=$?
            echo "gofmt exit status: $FMT_STATUS"
            echo "---"
            if [ -n "$UNFORMATTED" ]; then
              echo "The following Go files need formatting:"
              echo "$UNFORMATTED"
              exit 1
            fi
            echo "All Go files are properly formatted."

      - run:
          name: Wait for MongoDB
          command: |
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/mongo/27017) >/dev/null 2>&1; then
                echo "MongoDB is accepting connections."
                exit 0
              fi
              echo "Waiting for MongoDB... ($i/30)"
              sleep 1
            done
            echo "MongoDB did not become available within 30 seconds."
            exit 1

      - run:
          name: Run tests
          command: go test -v ./...

      - run:
          name: Run go vet
          command: go vet ./...

      - run:
          name: Build packages
          command: go build ./...

workflows:
  relay-validation:
    jobs:
      - relay-ci
