[project]
name = "relay-python-sdk"
version = "0.1.2"
description = "Official Python SDK for Relay webhook delivery infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "relay-python-sdk", email = "omchouhan227@gmail.com" }]
keywords = ["webhooks", "relay", "webhook-delivery"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.33", "mypy>=1.11", "ruff>=0.6", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/rajputomsingh/Relay"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]