basePath: /
definitions:
  github_com_rajputomsingh_relay_internal_endpoints.EventFilter:
    properties:
      event_types:
        items:
          type: string
        type: array
      sources:
        items:
          type: string
        type: array
    type: object
  internal_handlers.attemptHistoryResponse:
    properties:
      attempts:
        items:
          $ref: '#/definitions/internal_handlers.attemptResponse'
        type: array
      event_id:
        type: string
      has_more:
        type: boolean
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  internal_handlers.attemptResponse:
    properties:
      attempt_number:
        type: integer
      duration_ms:
        type: integer
      endpoint_id:
        type: string
      event_id:
        type: string
      finished_at:
        type: string
      http_status:
        type: integer
      id:
        type: string
      outcome:
        type: string
      started_at:
        type: string
    type: object
  internal_handlers.createEndpointRequest:
    properties:
      enabled:
        type: boolean
      event_filter:
        $ref: '#/definitions/github_com_rajputomsingh_relay_internal_endpoints.EventFilter'
      max_attempts:
        type: integer
      name:
        type: string
      rate_limit_rps:
        type: integer
      signing_secret:
        type: string
      url:
        type: string
    type: object
  internal_handlers.createEventRequest:
    properties:
      data:
        additionalProperties: {}
        type: object
      event_type:
        type: string
      source:
        type: string
    type: object
  internal_handlers.deliveryStateResponse:
    properties:
      attempts:
        type: integer
      delivered_at:
        type: string
      endpoint_id:
        type: string
      failed_at:
        type: string
      last_error:
        type: string
      max_attempts:
        type: integer
      next_attempt_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  internal_handlers.endpointHealthResponse:
    properties:
      attempts_1h:
        type: integer
      consecutive_failures:
        type: integer
      failures_1h:
        type: integer
      last_failure_at:
        type: string
        x-nullable: true
      last_success_at:
        type: string
        x-nullable: true
      p50_latency_ms:
        description: Approximate 50th percentile of successful attempt latencies in
          milliseconds over the past hour; null when no valid samples exist.
        example: 42
        type: number
        x-nullable: true
      p95_latency_ms:
        description: Approximate 95th percentile of successful attempt latencies in
          milliseconds over the past hour; null when no valid samples exist.
        example: 187
        type: number
        x-nullable: true
      p99_latency_ms:
        description: Approximate 99th percentile of successful attempt latencies in
          milliseconds over the past hour; null when no valid samples exist.
        example: 512
        type: number
        x-nullable: true
      success_rate_1h:
        type: number
      successes_1h:
        type: integer
    type: object
  internal_handlers.endpointListResponse:
    properties:
      count:
        type: integer
      endpoints:
        items:
          $ref: '#/definitions/internal_handlers.endpointResponse'
        type: array
    type: object
  internal_handlers.endpointResponse:
    properties:
      created_at:
        type: string
      disabled_at:
        type: string
      enabled:
        type: boolean
      event_filter:
        $ref: '#/definitions/github_com_rajputomsingh_relay_internal_endpoints.EventFilter'
      has_signing_secret:
        type: boolean
      id:
        type: string
      max_attempts:
        type: integer
      name:
        type: string
      rate_limit_rps:
        type: integer
      updated_at:
        type: string
      url:
        type: string
    type: object
  internal_handlers.eventDeliveriesResponse:
    properties:
      deliveries:
        items:
          $ref: '#/definitions/internal_handlers.deliveryStateResponse'
        type: array
      event_id:
        type: string
    type: object
  internal_handlers.eventInspectionResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
      delivered_at:
        type: string
      delivery_attempts:
        type: integer
      delivery_status:
        type: string
      event_type:
        type: string
      failed_at:
        type: string
      id:
        type: string
      idempotency_key:
        type: string
      last_replayed_at:
        type: string
      received_at:
        type: string
      replay_count:
        type: integer
      source:
        type: string
      status:
        type: string
    type: object
  internal_handlers.eventListResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/internal_handlers.eventInspectionResponse'
        type: array
      has_more:
        type: boolean
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  internal_handlers.serviceHealthResponse:
    properties:
      mongo:
        type: string
      status:
        type: string
      uptime_seconds:
        type: integer
      version:
        type: string
      worker:
        type: string
    type: object
  internal_handlers.updateEndpointRequest:
    properties:
      enabled:
        type: boolean
      event_filter:
        $ref: '#/definitions/github_com_rajputomsingh_relay_internal_endpoints.EventFilter'
      max_attempts:
        type: integer
      name:
        type: string
      rate_limit_rps:
        type: integer
      signing_secret:
        type: string
      url:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Relay Support
    url: https://github.com/rajputomsingh/Relay
  description: Reliable webhook delivery infrastructure.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Relay API
  version: "1.0"
paths:
  /healthz:
    get:
      description: Returns 200 if the service is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - health
  /metrics:
    get:
      description: Exposes Prometheus metrics in text exposition format.
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus metrics in text format
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Prometheus metrics
      tags:
      - metrics
  /readyz:
    get:
      description: |-
        Returns 200 if the service is ready to accept traffic.
        Checks MongoDB connectivity and required index existence.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - health
  /v1/endpoints:
    get:
      description: Returns all registered endpoints, enabled and disabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.endpointListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List endpoints
      tags:
      - endpoints
    post:
      consumes:
      - application/json
      description: Registers a new webhook destination. The signing secret cannot
        be read back after creation.
      parameters:
      - description: Endpoint configuration
        in: body
        name: endpoint
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createEndpointRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers.endpointResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Create an endpoint
      tags:
      - endpoints
  /v1/endpoints/{id}:
    delete:
      description: Soft-deletes an endpoint by setting enabled=false. The endpoint
        is not removed from the database.
      parameters:
      - description: Endpoint ID (MongoDB ObjectID hex)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Disable an endpoint
      tags:
      - endpoints
    get:
      description: Returns a single endpoint by ID.
      parameters:
      - description: Endpoint ID (MongoDB ObjectID hex)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.endpointResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get an endpoint
      tags:
      - endpoints
    patch:
      consumes:
      - application/json
      description: Applies a partial update to an endpoint.
      parameters:
      - description: Endpoint ID (MongoDB ObjectID hex)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: endpoint
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updateEndpointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.endpointResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Update an endpoint
      tags:
      - endpoints
  /v1/endpoints/{id}/health:
    get:
      description: |-
        Returns delivery attempts, success rate, consecutive failures, and the latest success/failure timestamps for an endpoint.
        Latency percentiles are approximate and use successful attempts from the same one-hour window. Attempts without a finished_at timestamp still count as successes but contribute no latency sample. All three percentiles are null when no valid samples exist; a measured zero is 0. Requires MongoDB 7.0+.
      parameters:
      - description: Endpoint ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.endpointHealthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get endpoint health
      tags:
      - endpoints
  /v1/events:
    get:
      description: Returns a paginated list of events, newest first.
      parameters:
      - description: Filter by parent delivery_status (pending, processing, delivered,
          failed, disabled, no_destination)
        in: query
        name: delivery_status
        type: string
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor from a previous response
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.eventListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List events
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Ingests an event and enqueues it for delivery.
      parameters:
      - description: Client-generated idempotency key
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Event payload
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createEventRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Submit an event
      tags:
      - events
  /v1/events/{id}:
    get:
      description: Returns the current state of an event, including its parent delivery_status
        derived by the lifecycle aggregator.
      parameters:
      - description: Event ID (MongoDB ObjectID hex)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.eventInspectionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Inspect an event
      tags:
      - events
  /v1/events/{id}/attempts:
    get:
      description: Returns the attempt history for an event, newest first.
      parameters:
      - description: Event ID (MongoDB ObjectID hex)
        in: path
        name: id
        required: true
        type: string
      - description: Page size (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Pagination cursor from a previous response
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.attemptHistoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List delivery attempts
      tags:
      - events
  /v1/events/{id}/deliveries:
    get:
      description: Returns the current delivery records for an event, one per endpoint.
      parameters:
      - description: Event ID (MongoDB ObjectID hex)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.eventDeliveriesResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: List deliveries for an event
      tags:
      - events
  /v1/events/{id}/replay:
    post:
      description: Requeues the failed child deliveries for a failed event. Successful
        deliveries are untouched. Preserves attempt history across replay cycles.
      parameters:
      - description: Event ID (MongoDB ObjectID hex)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Replay a failed event
      tags:
      - events
  /v1/health:
    get:
      description: |-
        Reports the health of the Relay service itself: MongoDB
        reachability, delivery worker state, build version, and uptime.
        Returns 503 when MongoDB is unreachable; the worker is not
        checked in that case.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.serviceHealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handlers.serviceHealthResponse'
      summary: Service health
      tags:
      - health
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
