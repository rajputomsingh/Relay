name: Welcome

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome:
    name: Welcome contributor
    runs-on: ubuntu-latest
    timeout-minutes: 2

    if: >-
      github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
      github.event.pull_request.author_association == 'FIRST_TIMER'

    steps:
      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = [
              `Welcome to Relay, @${pr.user.login}! Thanks for your first contribution.`,
              '',
              '**What happens next:**',
              '',
              '- CI checks will run automatically.',
              '- If a check fails, open its **Details** link, review the logs, and push a fix.',
              '- A maintainer will review your PR.',
              '',
              '**Contributor resources:**',
              '',
              `- [CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)`,
              `- [#81 Contributors Wanted](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/81)`,
              `- [Good first issues](https://github.com/${context.repo.owner}/${context.repo.repo}/labels/good%20first%20issue)`,
              '',
              'Thanks again for helping make Relay better!'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });