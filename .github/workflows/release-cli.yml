name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/relay-cli-${{ matrix.os }}-${{ matrix.arch }}${EXT}" \
            ./cmd/relay-cli
      - uses: actions/upload-artifact@v4
        with:
          name: relay-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/relay-cli-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum relay-cli-* > checksums.txt && cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/relay-cli-*
            dist/checksums.txt
          generate_release_notes: true