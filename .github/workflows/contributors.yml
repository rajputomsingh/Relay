name: Generate Contributors Wall

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Runs once a day to catch any edge cases
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG
        uses: lowlighter/metrics@latest
        with:
          filename: contributors.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          template: repository
          plugin_contributors: yes
          plugin_contributors_sections: contributors
          plugin_contributors_ignored: github-actions[bot]
          # Corrected Design settings
          config_display: columns
          config_presets: "dark"
          config_timezone: UTC
          config_padding: 0, 8 + 10%

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributors.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-update contributor wall [skip ci]"
          git push
