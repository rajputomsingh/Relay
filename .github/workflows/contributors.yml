name: Update Contributors Wall
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-wall:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Inject Avatars
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Fetch up to 100 contributors
            const response = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Filter out bots and generate the HTML string
            const contributors = response.data.filter(c => c.type !== 'Bot');
            let html = '';
            
            contributors.forEach(c => {
              html += `<a href="${c.html_url}"><img src="${c.avatar_url}&s=48" width="48" height="48" alt="${c.login}"></a> `;
            });
            
            // Read README
            let readme = fs.readFileSync('README.md', 'utf8');
            
            // Replace everything between the markers
            const startMarker = '<!-- contributors:start -->';
            const endMarker = '<!-- contributors:end -->';
            const regex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'g');
            
            const newReadme = readme.replace(regex, `${startMarker}\n${html}\n${endMarker}`);
            
            if (readme === newReadme) {
              console.log("No changes needed to README.");
              return;
            }

            // Get the current SHA of README.md (required for the API update)
            const fileData = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'README.md',
            });

            // Commit the change via the API (bypasses branch protection rules)
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'README.md',
              message: 'docs: auto-update contributors wall [skip ci]',
              content: Buffer.from(newReadme).toString('base64'),
              sha: fileData.data.sha,
              branch: 'main',
              committer: {
                name: 'github-actions[bot]',
                email: 'github-actions[bot]@users.noreply.github.com'
              }
            });
            console.log("Successfully updated README via API.");
