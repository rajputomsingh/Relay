name: Update Contributors Wall
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-wall:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and Inject Avatars
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Fetch up to 100 contributors
            const response = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            // Filter out bots and generate the HTML string exactly like recodehive
            const contributors = response.data.filter(c => c.type !== 'Bot');
            let html = '';
            
            contributors.forEach(c => {
              html += `<a href="${c.html_url}"><img src="${c.avatar_url}&s=48" width="48" height="48" alt="${c.login}"></a> `;
            });
            
            // Read README
            let readme = fs.readFileSync('README.md', 'utf8');
            
            // Replace everything between the markers
            const startMarker = '<!-- contributors:start -->';
            const endMarker = '<!-- contributors:end -->';
            
            const regex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`, 'g');
            readme = readme.replace(regex, `${startMarker}\n${html}\n${endMarker}`);
            
            // Write back to README
            fs.writeFileSync('README.md', readme);

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-update contributors wall [skip ci]"
          git push
